name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # NuGet Trusted Publishing için OIDC token
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Tag ile csproj versiyonunun eşleştiğini doğrula
        run: |
          tag="${GITHUB_REF_NAME#v}"
          csproj=$(grep -oPm1 '(?<=<Version>)[^<]+' Emf2Svg.csproj)
          if [ "$tag" != "$csproj" ]; then
            echo "::error::Tag ($tag) ile Emf2Svg.csproj <Version> ($csproj) uyuşmuyor."
            exit 1
          fi
          echo "Sürüm doğrulandı: $csproj"

      - name: Test
        run: dotnet test -c Release

      - name: Pack
        run: dotnet pack Emf2Svg.csproj -c Release -o nupkg

      - name: NuGet login (OIDC -> geçici API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: dotnet nuget push nupkg/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
